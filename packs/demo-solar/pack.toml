# Example business pack. Ghamghar Solar is fictional; every fact, price and
# policy below was invented for testing Sel.

[pack]
id = "demo-solar"
name = "Ghamghar Solar (fictional)"
description = "Residential rooftop solar installer in the Kathmandu valley. Sells grid-tie systems by phone after a website inquiry."
languages = ["ne", "en"]
week_starts_on = "sunday"

[templates]
email = "templates/followup-email.md"
calendar = "templates/followup-calendar.md"

[[scorecard]]
id = "discovery"
title = "Discovery before price"
description = "Learn the customer's monthly electricity bill, roof space and household load before quoting a price."
weight = 2

[[scorecard]]
id = "objection-handling"
title = "Price objections answered with value"
description = "When the customer compares on price, ask what the other quote includes (panel brand, inverter, warranty) before defending the price."
weight = 2

[[scorecard]]
id = "accurate-claims"
title = "Only approved product claims"
description = "Warranty terms, generation figures and approval timelines must match the product sheet. Say 'I'll confirm' instead of guessing."
weight = 3

[[scorecard]]
id = "clear-next-step"
title = "Next step with a date"
description = "Every promised follow-up (quotation, site visit, callback) is agreed with a specific day."
weight = 2
