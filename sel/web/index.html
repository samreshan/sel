<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sel · Sales coaching</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="prefetch" href="/static/sim.js" as="script">
  <link rel="prefetch" href="/static/coach.js" as="script">
  <link rel="prefetch" href="/static/practice.js" as="script">
  <link rel="prefetch" href="/static/team.js" as="script">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Sel">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-5 3 10 2-5h6"/></svg>
        </span>
        <div class="brand-copy"><span class="brand-name">Sel</span><span class="brand-caption">A little better, every call.</span></div>
      </div>

      <div class="viewer">
        <label for="viewer" class="nav-title">Viewing as</label>
        <div class="viewer-identity"><span id="viewer-portrait" aria-hidden="true"></span><select id="viewer"></select></div>
        <a class="viewer-manage small" href="#people">Manage people</a>
      </div>

      <button type="button" class="primary new-call" id="new-call">
        <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#add"/></svg>
        New call
      </button>
      <nav class="primary-nav" aria-label="Sections">
        <a href="#today" data-nav="today">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#calendar"/></svg>
          Today
        </a>
        <a href="#calls" data-nav="calls">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#phone"/></svg>
          Calls
        </a>
        <a href="#practice" data-nav="practice" id="open-sim">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#target"/></svg>
          Practice
          <span class="live-dot" aria-hidden="true"></span>
        </a>
        <a href="#playbook" data-nav="playbook">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#doc"/></svg>
          Playbook
        </a>
        <a href="#leads" data-nav="leads">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#user"/></svg>
          Leads
        </a>
        <a href="#team" data-nav="team" hidden>
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#gauge"/></svg>
          Team
        </a>
        <a href="#settings" data-nav="settings">
          <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#lock"/></svg>
          Settings
        </a>
      </nav>

      <section class="device-card" aria-labelledby="device-title">
        <p id="device-title" class="device-title">
          <svg class="solar-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#lock"/></svg>
          On this computer
        </p>
        <div id="health" class="health" role="status" aria-live="polite">Checking…</div>
      </section>
      <a class="design-system-link" href="/static/design-system.html">Design system</a>
      <p class="icon-credit">Icons by <a href="https://www.figma.com/community/file/1166831539721848736" target="_blank" rel="noopener noreferrer">480 Design</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></p>
    </aside>

    <div class="workspace">
      <main id="main" class="main"></main>
      <div class="review-dock" hidden>
        <ol id="steps" class="steps" aria-label="Review progress" hidden></ol>
      </div>
    </div>
  </div>

  <script src="/static/dropdown.js"></script>
  <script src="/static/app.js" data-sim="/static/sim.js" data-coach="/static/coach.js" data-practice="/static/practice.js" data-team="/static/team.js" data-worklet="/static/pcm-worklet.js"></script>
</body>
</html>
