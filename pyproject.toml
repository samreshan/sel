[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sel"
version = "0.0.1"
description = "On-device assistant for reviewing recorded sales calls (reference pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sel = "sel.cli:main"

[tool.setuptools]
packages = ["sel"]
