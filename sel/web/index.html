<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sel · Call review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="prefetch" href="/static/sim.js" as="script">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Sel">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l2-5 3 10 2-5h6"/></svg>
        </span>
        <span class="brand-name">Sel</span>
      </div>

      <button type="button" class="primary new-call" id="new-call">
        <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#add"/></svg>
        New call
      </button>
      <button type="button" class="new-sim" id="open-sim" aria-current="false">
        <svg class="solar-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#phone"/></svg>
        Call simulator
        <span class="live-dot" aria-hidden="true"></span>
      </button>

      <nav class="nav-section" aria-labelledby="calls-title">
        <h2 id="calls-title" class="nav-title">Calls</h2>
        <p id="list-error" class="form-error" role="alert" hidden></p>
        <ul id="call-list" class="call-list"></ul>
        <p id="list-empty" class="muted small" hidden>No calls yet. Choose New call to add a recording.</p>
      </nav>

      <section class="device-card" aria-labelledby="device-title">
        <p id="device-title" class="device-title">
          <svg class="solar-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/solar-icons.svg#lock"/></svg>
          Runs on this device
        </p>
        <div id="health" class="health" role="status" aria-live="polite">Checking models…</div>
      </section>
      <p class="icon-credit">Icons by <a href="https://www.figma.com/community/file/1166831539721848736" target="_blank" rel="noopener noreferrer">480 Design</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></p>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <ol id="steps" class="steps" aria-label="Review progress" hidden></ol>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>

  <script src="/static/app.js" data-sim="/static/sim.js" data-worklet="/static/pcm-worklet.js"></script>
</body>
</html>
